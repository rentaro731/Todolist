<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todoリスト</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <h1 class="logo">JS Todoリスト</h1>
    <header>
      <div class="radio-button">
        <input type="radio" id="all" name="light" value="all" checked />
        <label for="all">すべて</label>
        <input type="radio" id="work" name="light" value="work" />
        <label for="work">作業中</label>
        <input type="radio" id="completion" name="light" value="completion" />
        <label for="completion">完了</label>
      </div>
    </header>
    <main>
      <table id="table">
        <thead>
          <tr>
            <th>ID</th>
            <th>タスク名</th>
            <th>期限</th>
            <th>状態</th>
            <th>削除</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <form id="form">
        <input type="text" id="text" placeholder="タスク名を入力" />
        <input type="date" id="date" />
        <button type="submit" id="addition">追加</button>
      </form>
    </main>
    <script src="script.js"></script>
    <script src="learning.js"></script>
  </body>
</html>
