<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todoリスト</title>
    <link rel="stylesheet" href="stylesheet.css" />
  </head>
  <body>
    <header>
      <h1 class="logo">JS Todoリスト</h1>
      <div class="radio-button">
        <input type="radio" id="all" name="light" value="all" checked />
        <label for="all">すべて</label>
        <input type="radio" id="work" name="light" value="work" />
        <label for="work">作業中</label>
        <input type="radio" id="completion" name="light" value="completion" />
        <label for="completion">完了</label>
      </div>
    </header>
    <main>
      <table>
        <tr>
          <th>ID</th>
          <th>タスク名</th>
          <th>期限</th>
          <th>状態</th>
          <th>削除</th>
        </tr>
        <tr>
          <td>1</td>
          <td>JavaScriotの基礎</td>
          <td>2024-01-01</td>
          <td>
            <button class="work-button">作業中</button>
          </td>
          <td>
            <button class="delete">✖️</button>
          </td>
        </tr>
        <tr>
          <td>2</td>
          <td>非同期処理</td>
          <td>2024-12-31</td>
          <td>
            <button class="work-button">作業中</button>
          </td>
          <td>
            <button class="delete">✖️</button>
          </td>
        </tr>
        <tr>
          <td>3</td>
          <td>オブジェクト指向</td>
          <td>2025-01-01</td>
          <td>
            <button class="work-button">作業中</button>
          </td>
          <td>
            <button class="delete">✖️</button>
          </td>
        </tr>
      </table>
      <table>
        <tr>
          <td><input type="text" value="タスク名を入力" /></td>
          <td><input type="date" /></td>
          <td><button class="addition">追加</button></td>
        </tr>
      </table>
    </main>
    <script src="script.js"></script>
  </body>
</html>
